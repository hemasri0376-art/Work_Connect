<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job | WorkConnect</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="post-job-page">

    <nav class="jobs-nav">
        <a href="/" class="jobs-brand">WorkConnect</a>
        <a href="/" class="jobs-home">Home</a>
    </nav>

    <main class="post-job-main">
        <header class="post-job-heading">
            <p class="jobs-eyebrow">FOR EMPLOYERS</p>
            <h1>Post a Job</h1>
            <p>Find suitable workers for your requirements.</p>
        </header>

        <section class="post-job-card">
            <h2 class="post-job-card-heading">Job Details</h2>
            <p class="post-job-intro">
                Enter the details below to publish your work opportunity.
            </p>

            <form action="/jobs/post" method="POST" class="post-job-form">

                <div class="post-job-field">
                    <label for="employer_email">
                        Registered employer email
                    </label>
                    <input id="employer_email"
                           name="employer_email"
                           type="email"
                           required
                           placeholder="Enter your registered email">
                </div>

                <div class="post-job-field">
                    <label for="title">Job title</label>
                    <input id="title"
                           name="title"
                           type="text"
                           required
                           placeholder="e.g. Farm Worker">
                </div>

                <div class="post-job-field">
                    <label for="skill_required">Required skill</label>
                    <select id="skill_required"
                            name="skill_required"
                            required>
                        <option value="">Select a skill</option>
                        <option value="Farming">Farming</option>
                        <option value="Masonry">Masonry</option>
                        <option value="Driving">Driving</option>
                        <option value="Electrician">Electrician</option>
                        <option value="Plumbing">Plumbing</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="post-job-field">
                    <label for="description">Job description</label>
                    <textarea id="description"
                              name="description"
                              rows="4"
                              required
                              placeholder="Describe the work and requirements"></textarea>
                </div>

                <div class="post-job-field">
                    <label for="location">Job location</label>
                    <input id="location"
                           name="location"
                           type="text"
                           required
                           placeholder="Enter town or village">
                </div>

                <div class="post-job-field">
                    <label for="workers_needed">
                        Number of workers needed
                    </label>
                    <input id="workers_needed"
                           name="workers_needed"
                           type="number"
                           min="1"
                           max="10000"
                           required>
                </div>

                <div class="post-job-field">
                    <label for="daily_wage">
                        Daily wage per worker (₹)
                    </label>
                    <input id="daily_wage"
                           name="daily_wage"
                           type="number"
                           min="0"
                           step="1"
                           required>
                </div>

                <button type="submit" class="post-job-submit">
                    Publish Job
                </button>
            </form>
        </section>

        <p class="post-job-footer">
            Looking for work?
            <a href="{{ url_for('browse_jobs') }}">Browse available jobs</a>
        </p>
    </main>

</body>
</html>
